<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Room of Many Dreams</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f1ec; color: #1a1816; }
    #shared-canvas { position: fixed; inset: 0; }

    .shared-top {
      position: fixed; top: 24px; left: 24px; right: 24px; z-index: 5;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .shared-top > * { pointer-events: auto; }
    .shared-title { margin: 0; font-family: var(--font-serif); font-size: 22px; font-weight: 400; }
    .return-link { position: fixed; top: 28px; right: 24px; color: #1a1816; font-size: 13px; text-decoration: none; opacity: 0.7; white-space: nowrap; }
    .return-link:hover { opacity: 1; }

    .shared-status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5;
      font-size: 16px; margin: 0;
    }

    /* Detail card: someone's 3 versions + answers */
    .dream-detail {
      position: fixed; z-index: 6; left: 50%; bottom: 28px; transform: translateX(-50%);
      width: min(560px, calc(100% - 32px));
      background: #fff; border-radius: 12px; padding: 20px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    }
    .dream-detail[hidden] { display: none; }
    .detail-versions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .detail-versions img { width: 100%; aspect-ratio: 21 / 9; object-fit: cover; border-radius: 4px; background: #eee; }
    .detail-versions img.is-picked { outline: 2px solid #1a1816; outline-offset: 2px; }
    .detail-answers { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .detail-answers li { font-size: 14px; line-height: 1.4; }
    .detail-answers .q { display: block; font-size: 11px; opacity: 0.55; letter-spacing: 0.04em; }
    .detail-close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 18px; cursor: pointer; color: #1a1816; }

    .shared-hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 4;
      font-size: 12px; color: rgba(0, 0, 0, 0.5); margin: 0; white-space: nowrap;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="shared-canvas"></div>

  <header class="shared-top">
    <h1 class="shared-title">The Room of Many Dreams</h1>
    <a class="return-link" href="index.html">Back to your room</a>
  </header>

  <p class="shared-status" id="sharedStatus">Gathering dreams…</p>

  <div class="dream-detail" id="dreamDetail" hidden>
    <button class="detail-close" id="detailClose" aria-label="Close">×</button>
    <div class="detail-versions" id="detailVersions"></div>
    <ul class="detail-answers" id="detailAnswers"></ul>
  </div>

  <p class="shared-hint">Drag to look around · Touch a dream to step closer</p>

  <script type="module" src="shared.js"></script>
</body>
</html>
