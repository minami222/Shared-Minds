<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspiration Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Palette: #F5F4E7 cream · #DDE2C6 pale sage · #C1D5BE sage · #D34627 vermilion · #090C02 ink */
    --bg: #F5F4E7;
    --surface: #FDFCF6;     /* lightest tint of the cream for cards */
    --fill: #DDE2C6;
    --fill-2: #C1D5BE;
    --text: #090C02;
    --text-2: #4f5346;      /* ink at ~70%: 7:1 on cream */
    --line: rgba(9, 12, 2, 0.1);
    --accent: #D34627;      /* white text on it: 5.9:1 */
    --accent-hover: #bf3d20;
    --accent-fill: rgba(211, 70, 39, 0.14);
    --gen: #4f5346;
    --ok: #2f4a2a;
    --serif: "Merriweather", Georgia, serif;
    --shadow-sm: 0 1px 2px rgba(9,12,2,0.04), 0 2px 8px rgba(9,12,2,0.05);
    --shadow-lg: 0 2px 6px rgba(9,12,2,0.05), 0 24px 60px rgba(9,12,2,0.14);
    --r-lg: 24px; --r-md: 16px; --r-sm: 12px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid rgba(211,70,39,0.5); outline-offset: 2px; }
  img { display: block; }
  [hidden] { display: none !important; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Map ---------- */
  #map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
  #map:active { cursor: grabbing; }

  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: max(14px, env(safe-area-inset-top)) 16px 12px; background: linear-gradient(var(--bg) 40%, rgba(245,244,231,0)); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
  .brand svg { width: 18px; height: 18px; fill: var(--accent); stroke: none; }
  .top-actions { display: flex; gap: 8px; }
  .btn-quiet { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 40px; padding: 0 14px; border-radius: 999px; border: none;
    background: rgba(253,252,246,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow-sm);
    font-size: 14px; font-weight: 600; transition: background .15s; }
  .btn-quiet:hover { background: var(--surface); }
  .btn-quiet:disabled { opacity: .5; cursor: progress; }
  .count { color: var(--text-2); font-weight: 500; }

  .legend { position: fixed; left: 16px; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 5; display: flex; gap: 14px;
    font-size: 12px; color: var(--text-2); pointer-events: none; background: rgba(253,252,246,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 8px 12px; border-radius: 999px; box-shadow: var(--shadow-sm); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; display: inline-block; }
  .lg-art { background: var(--fill-2); border-radius: 2px; }
  .lg-person { background: var(--text-2); border-radius: 50%; }
  .lg-gen { border: 1.5px dashed var(--gen); transform: rotate(45deg) scale(.85); }
  .lg-me { border: 2.5px solid var(--accent); border-radius: 50%; }

  .fab { position: fixed; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 6; width: 60px; height: 60px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(211,70,39,0.35); transition: transform .2s var(--ease); }
  .fab:hover { transform: scale(1.05); }
  .fab:active { transform: scale(.96); }
  .fab svg.i { width: 26px; height: 26px; stroke-width: 2.2; }

  .toast { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 54px); left: 50%; transform: translateX(-50%); z-index: 60;
    background: var(--text); color: #fff; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow-lg); }

  /* ---------- Modal (capture + ask) ---------- */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(9,12,2,0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: grid; place-items: center; padding: 16px; animation: fade .2s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
  .modal { width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--surface); border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg); padding: 20px; animation: rise .3s var(--ease); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; min-height: 40px; }
  .steps { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-2); font-weight: 500; }
  .steps b { color: var(--text); font-weight: 700; }
  .steps .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-2); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--fill); display: grid; place-items: center; color: var(--text-2); }
  .icon-btn:hover { background: var(--fill-2); color: var(--text); }
  h2.title { font-family: var(--serif); font-size: 26px; line-height: 1.2; font-weight: 500; letter-spacing: 0; margin: 0 0 18px; }

  .field-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .input { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 16px; }
  .input:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-fill); }
  .public { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-2); margin: 10px 0 20px; }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; min-height: 50px; padding: 0 18px; border-radius: 999px; border: none; background: var(--fill); font-size: 16px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .1s; }
  .btn:hover { background: var(--fill-2); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.block { width: 100%; }

  .photo-hero { position: relative; border-radius: var(--r-md); overflow: hidden; background: var(--fill); }
  .photo-hero img { width: 100%; max-height: 46dvh; object-fit: cover; }
  .palette { display: flex; gap: 6px; margin-top: 12px; }
  .palette span { flex: 1; height: 28px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(9,12,2,0.06); }
  .placing { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 14px; color: var(--text-2); font-weight: 500; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--fill-2); border-top-color: var(--text); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: var(--accent); font-size: 14px; margin-top: 12px; }

  /* Ask step */
  .ask-photo { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
  .ask-photo img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; }
  .mini-pal { display: flex; gap: 4px; }
  .mini-pal span { width: 18px; height: 18px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(9,12,2,0.06); }
  .sub-head { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; }
  .sub-head .icon-btn { width: 36px; height: 36px; }
  .sub-head h3 { margin: 0; font-family: var(--serif); font-size: 22px; line-height: 1.2; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, transform .1s; }
  .chip:hover { background: var(--bg); }
  .chip:active { transform: scale(.97); }
  .chip[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
  .chip .ans { font-weight: 500; opacity: .75; }
  .chip.sm { min-height: 32px; padding: 0 12px; font-size: 13px; pointer-events: none; }
  .chips-anim > * { animation: rise .25s var(--ease) both; }
  .words-toggle { margin-top: 16px; background: none; border: none; color: var(--accent); font-weight: 600; font-size: 15px; padding: 10px 0; display: inline-flex; gap: 6px; align-items: center; }
  textarea.input { resize: none; min-height: 84px; line-height: 1.45; margin-top: 12px; }
  .ask-footer { margin-top: 20px; }

  /* ---------- Result (split screen) ---------- */
  .result { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; animation: fade .25s var(--ease); }
  .result-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: rgba(245,244,231,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .result-grid { max-width: 1120px; margin: 0 auto; padding: 8px 20px 40px; display: grid; grid-template-columns: minmax(0, 0.85fr) auto minmax(0, 1.15fr); gap: 28px; align-items: start; }
  .col-label { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); margin: 0 0 12px; }
  .card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 16px; animation: rise .4s var(--ease) both; }
  .card img.hero { width: 100%; border-radius: var(--r-md); object-fit: cover; background: var(--fill); }
  .you img.hero { aspect-ratio: 4 / 3; }
  .art img.hero { max-height: 52dvh; object-fit: contain; background: var(--fill); }
  .you .chips { margin-top: 14px; }
  .quote { margin: 14px 0 0; font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.45; font-weight: 400; }
  .shift { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--text-2); }
  .shift i { color: var(--text); font-style: normal; font-weight: 600; }
  .arrow { align-self: center; color: var(--text-2); display: grid; place-items: center; padding-top: 32px; }
  .arrow svg.i { width: 28px; height: 28px; }
  .art h2 { font-family: var(--serif); font-size: 32px; line-height: 1.15; font-weight: 500; letter-spacing: -0.01em; margin: 18px 0 6px; }
  .art .by { font-size: 16px; color: var(--text-2); font-weight: 500; }
  .badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--fill); color: var(--text-2); }
  .badge.on { background: var(--fill-2); color: var(--ok); }
  .badge.gen { background: transparent; border: 1px dashed var(--text-2); color: var(--text-2); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .section { margin-top: 22px; }
  .section h4 { margin: 0 0 6px; font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
  .section h4 small { font-size: 12px; font-weight: 500; color: var(--text-2); }
  .section p { margin: 0; font-size: 16px; line-height: 1.6; color: var(--text); max-width: 62ch; }
  .facts { font-size: 14px; color: var(--text-2); margin-top: 8px; }
  .skeleton { display: grid; gap: 8px; }
  .skeleton span { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--fill) 25%, var(--fill-2) 50%, var(--fill) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  .skeleton span:last-child { width: 60%; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .met-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 22px; color: var(--accent); font-weight: 600; text-decoration: none; font-size: 15px; min-height: 44px; }
  .met-link:hover { text-decoration: underline; }
  .person-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-sm); border: none; text-align: left; width: 100%; }
  .person-row img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
  .person-row .k { font-size: 13px; color: var(--text-2); font-weight: 600; }
  .person-row .n { font-weight: 700; }
  .person-row .w { font-size: 14px; color: var(--text-2); }
  .person-row.empty { color: var(--text-2); font-size: 14px; cursor: default; }

  /* ---------- Detail sheet + drawer ---------- */
  .sheet { position: fixed; z-index: 35; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(420px, calc(100% - 32px)); max-height: 70dvh; overflow-y: auto;
    background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 16px; animation: rise .25s var(--ease); }
  .sheet img.hero { width: 100%; max-height: 36dvh; object-fit: contain; border-radius: var(--r-md); background: var(--fill); }
  .sheet h3 { margin: 14px 0 2px; font-family: var(--serif); font-size: 22px; line-height: 1.2; font-weight: 500; }
  .sheet .meta { color: var(--text-2); font-size: 15px; }
  .sheet .btn { margin-top: 16px; }
  .sheet .close { position: absolute; top: 24px; right: 24px; background: rgba(253,252,246,0.92); }
  .drawer { position: fixed; z-index: 35; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--surface); box-shadow: var(--shadow-lg);
    padding: max(16px, env(safe-area-inset-top)) 16px 16px; overflow-y: auto; animation: slide .3s var(--ease); }
  @keyframes slide { from { transform: translateX(30px); opacity: 0; } }
  .mine-list { display: grid; gap: 4px; }
  .mine-item { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: var(--r-sm); border: none; background: none; text-align: left; width: 100%; }
  .mine-item:hover { background: var(--bg); }
  .mine-item img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex: none; }
  .mine-item .w { font-weight: 600; font-size: 15px; }
  .mine-item .d { font-size: 13px; color: var(--text-2); }
  .empty-state { color: var(--text-2); font-size: 15px; }

  @media (max-width: 760px) {
    .result-grid { grid-template-columns: 1fr; gap: 16px; padding: 4px 16px 32px; }
    .arrow { padding: 0; transform: rotate(90deg); }
    .arrow svg.i { width: 22px; height: 22px; }
    .you .card { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; }
    .you img.hero { aspect-ratio: 1; }
    .you .chips, .you .quote { margin-top: 0; }
    .you .palette { margin-top: 8px; }
    .you .stack { display: grid; gap: 10px; }
    .you .shift { grid-column: 1 / -1; margin-top: 0; }
    .art h2 { font-size: 26px; }
    .legend { display: none; }
    .result-bar .steps { display: none; }
    .scrim { place-items: end center; padding: 0; }
    .modal { border-radius: var(--r-lg) var(--r-lg) 0 0; width: 100%; max-height: 92dvh; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8a2 2 0 012-2h2l2-2h6l2 2h2a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
</svg>

<canvas id="map" aria-label="Map of paintings and captures, arranged by similarity"></canvas>

<header class="top">
  <a href="../" class="brand"><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg>Constellation</a>
  <div class="top-actions">
    <button id="mineBtn" class="btn-quiet"><svg class="i"><use href="#i-grid"/></svg>Mine <span class="count" id="mineCount">0</span></button>
    <button id="genBtn" class="btn-quiet" title="Adds AI-generated samples, always labeled"><svg class="i"><use href="#i-spark"/></svg>Generate</button>
  </div>
</header>

<div class="legend" aria-hidden="true">
  <span><i class="lg-art"></i>Paintings</span>
  <span><i class="lg-person"></i>People</span>
  <span><i class="lg-gen"></i>Generated</span>
  <span><i class="lg-me"></i>You</span>
</div>

<button id="addBtn" class="fab" aria-label="New capture"><svg class="i"><use href="#i-plus"/></svg></button>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Capture + Ask modal -->
<div id="flow" class="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="flowTitle">
    <div class="modal-head">
      <div class="steps" id="steps"></div>
      <button class="icon-btn" data-action="close-flow" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div id="flowBody"></div>
  </div>
</div>

<!-- Result: before → after -->
<section id="result" class="result" hidden aria-label="Your match"></section>

<!-- Map detail -->
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="false"></div>

<!-- Mine -->
<aside id="drawer" class="drawer" hidden aria-labelledby="mineTitle">
  <div class="modal-head"><h2 class="title" id="mineTitle" style="margin:0">Your captures</h2>
    <button class="icon-btn" data-action="close-drawer" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="mine-list" id="mineList"></div>
</aside>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileUp" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/umap-js@1.4.0/lib/umap-js.min.js"></script>
<script src="paintings.js"></script>
<script>
// ---------- Config ----------
const PROXY = "https://itp-ima-replicate-proxy.web.app/api/create_n_get";
const CLIP = "1c0371070cb827ec3c7f2f28adcdde54b50dcd239aa6faea0bc98b174ef03fb4"; // krthr/clip-embeddings: image data URIs + text
const WHY_WEIGHT = 1.0;
const LS_KEY = "constellation.v1", ABOUT_KEY = "constellation.about.v1";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

          `<button class="chip" data-opt="${esc(o)}" aria-pressed="${flow.draft[p.key] === o}">${esc(o)}</button>`).join("")}</div>`
      : `
        <h2 class="title" id="flowTitle">Why did you take this photo?</h2>
        <div class="chips" role="group" aria-label="What caught your eye">${PILLS.map(p =>
          `<button class="chip" data-pill="${p.key}" aria-pressed="${p.key in flow.draft}">${p.label}${flow.draft[p.key] ? `<span class="ans">· ${esc(flow.draft[p.key])}</span>` : ""}</button>`).join("")}</div>
        ${flow.showWords || "memory" in flow.draft
          ? `<textarea class="input" id="whyInput" maxlength="200" rows="3" aria-label="In your own words" placeholder="${"memory" in flow.draft ? "Who or where did it remind you of?" : "In your own words"}">${esc(flow.why)}</textarea>`
          : `<button class="words-toggle" data-action="show-words">${icon("pen")}Add your words</button>`}
        <div class="ask-footer"><button class="btn primary block" data-action="explore" ${S.thinking ? "disabled" : ""}>
          ${S.thinking ? `<span class="spinner" style="border-top-color:#fff"></span>Exploring…` : `Let’s explore ${icon("arrow")}`}</button></div>`}`;
    const t = $("whyInput"); if (t) { t.oninput = () => flow.why = t.value; t.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); explore(); } }; }
  }
}
$("flowBody").addEventListener("click", e => {
  const a = e.target.closest("[data-action]")?.dataset.action, pill = e.target.closest("[data-pill]")?.dataset.pill, opt = e.target.closest("[data-opt]")?.dataset.opt;
  if (a === "camera" || a === "upload") {
    const n = $("nameInput");
    if (!n.value.trim()) { n.focus(); toast("Add your name first"); return; }
    if (n.value.trim() !== S.me.name) { S.me.name = n.value.trim(); store.save(); }
    $(a === "camera" ? "fileCam" : "fileUp").click();
  } else if (a === "retry-embed") embedFlowPhoto();
  else if (a === "show-words") { flow.showWords = true; renderFlow(); $("whyInput")?.focus(); }
  else if (a === "pill-back") { flow.openPill = null; renderFlow(); }
  else if (a === "explore") explore();
  else if (pill) {
    const p = pillByKey[pill];
    if (p.memory) { if (pill in flow.draft) delete flow.draft[pill]; else flow.draft[pill] = null; renderFlow(); $("whyInput")?.focus(); return; }
    if (!(pill in flow.draft)) flow.draft[pill] = null;
    flow.openPill = pill; renderFlow();
  } else if (opt && flow.openPill) {
    const k = flow.openPill;
    if (flow.draft[k] === opt) delete flow.draft[k]; else flow.draft[k] = opt; // tap again to remove
    flow.openPill = null; renderFlow();
  }
});
$("fileCam").onchange = $("fileUp").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const url = URL.createObjectURL(f);
  try { const img = await loadImg(url); flow.photo = resizeToDataURL(img, 512); flow.palette = extractPalette(img); }
  catch { toast("Couldn't read that image"); return; } finally { URL.revokeObjectURL(url); }
  renderFlow(); embedFlowPhoto();
};
async function embedFlowPhoto() {
  flow.error = ""; renderFlow();
  try {
    const imgEmb = await embedImage(flow.photo);
    const c = { id: uid(), kind: "person", owner: S.me.id, name: S.me.name, photo: flow.photo, palette: flow.palette, imgEmb, why: "", pills: {}, query: "", whyEmb: null, notes: {}, createdAt: Date.now() };
    refresh(c); S.captures.push(c); store.save();
    S.active = c; S.results = nearestFor(c); focusOn(c, [S.results.painting]);
    flow.capture = c; flow.step = "ask"; renderFlow();
  } catch (err) { console.error(err); flow.error = "Couldn't reach the model. Your photo is safe."; renderFlow(); }
}
async function explore() {
  const c = flow.capture; if (!c || S.thinking) return;
  const t = $("whyInput"); if (t) flow.why = t.value;
  const why = flow.why.trim(), pills = { ...flow.draft }, query = composeQuery(c, pills, why);
  S.thinking = true; S.active = c; renderFlow();
  try {
    const whyEmb = query ? (query === c.query && c.whyEmb ? c.whyEmb : await embedText(query)) : null;
    Object.assign(c, { why, pills, query, whyEmb }); refresh(c); store.save();
    S.thinking = false; flow.step = "explore"; closeFlow(); showResult(c);
  } catch (err) { console.error(err); S.thinking = false; renderFlow(); toast("Couldn't explore — try again"); }
}

// ---------- Result: before → after ----------
function showResult(c) {
  S.active = c; const r = S.results = nearestFor(c), p = r.painting.data;
  const chips = pillSummary(c.pills);
  const shift = c.query && r.alone !== r.painting ? `Photo alone → <i>${esc(r.alone.data.title)}</i>. Your answers moved it here.` : "";
  const noteKey = p.id + "|" + (c.query || ""), note = c.notes?.[noteKey], about = aboutCache[p.id];
  const skel = `<div class="skeleton"><span></span><span></span><span></span></div>`;
  $("result").innerHTML = `
    <div class="result-bar">
      <button class="btn-quiet" data-action="edit">${icon("back")}Edit answers</button>
      <div class="steps">${(flow.step = "explore", stepsHTML())}</div>
      <button class="btn-quiet" data-action="to-map">${icon("map")}Map</button>
    </div>
    <div class="result-grid">
      <div class="you">
        <div class="col-label">You</div>
        <div class="card">
          <img class="hero" src="${c.photo}" alt="Your photo">
          <div class="stack">
            ${paletteHTML(c.palette)}
            ${chips.length ? `<div class="chips">${chips.map(t => `<span class="chip sm" aria-pressed="true">${esc(t)}</span>`).join("")}</div>` : ""}
            ${c.why ? `<p class="quote">“${esc(c.why)}”</p>` : ""}
          </div>
          ${shift ? `<div class="shift">${shift}</div>` : ""}
        </div>
      </div>
      <div class="arrow" aria-hidden="true">${icon("arrow")}</div>
      <div class="art">
        <div class="col-label">Your match</div>
        <div class="card" style="animation-delay:.08s">
          <img class="hero" src="${esc(p.img)}" alt="${esc(p.title)}">
          <h2>${esc(p.title)}</h2>
          <div class="by">${esc(p.artist)} · ${esc(p.date)}</div>
          ${p.gallery ? `<span class="badge on"><span class="dot"></span>On view · Gallery ${esc(p.gallery)}</span>` : `<span class="badge">Not on view</span>`}
          <div class="section"><h4>About this artwork <small>AI-written</small></h4><div id="aboutEl">${about ? `<p>${esc(about)}</p>` : skel}</div>
            <div class="facts">${esc([p.medium, p.bio && p.artist + " (" + p.bio + ")"].filter(Boolean).join(" · "))}</div></div>
          <div class="section" id="whySec"><h4>Why they match</h4><div id="noteEl">${note ? `<p>${esc(note)}</p>` : skel}</div></div>
          <a class="met-link" href="${esc(p.url)}" target="_blank" rel="noopener">Read more at The Met ${icon("ext")}</a>
        </div>
      </div>
      ${r.person ? `<button class="person-row" data-goto="${r.person.id}"><img src="${esc(r.person.photo)}" alt="">
          <div><div class="k">Nearest person</div><div class="n">${esc(r.person.name)}</div><div class="w">${esc(r.person.why || pillSummary(r.person.pills).join(" · "))}</div></div></button>`
        : `<div class="person-row empty">No one nearby yet — people appear once the map is shared.</div>`}
    </div>`;
  $("result").hidden = false; $("result").scrollTop = 0;
  if (!about) writeAbout(r.painting);
  if (!note) writeWhy(c, r.painting, noteKey);
}
async function writeAbout(painting) {
  const p = painting.data;
  const prompt = `This is "${p.title}" by ${p.artist}${p.bio ? ` (${p.bio})` : ""}, ${p.date}, ${p.medium || "painting"}, in The Met's collection.
In 2–3 short sentences (under 60 words), tell a curious non-expert what they are looking at and one interesting thing about how it was painted or its context. Don't repeat the title, artist or date (they're shown above). Only state facts you are confident of; describe what is visible. No preamble.`;
  try { const text = await see(prompt, [p.img]); if (!text) throw 0; aboutCache[p.id] = text; saveAbout(); if (S.results?.painting === painting) $("aboutEl").innerHTML = `<p>${esc(text)}</p>`; }
  catch (err) { console.warn(err); if (S.results?.painting === painting) $("aboutEl").innerHTML = ""; }
}
async function writeWhy(c, painting, key) {
  const p = painting.data, caught = pillSummary(c.pills);
  const prompt = `Image 1 is a photo a visitor took. Image 2 is "${p.title}" by ${p.artist}.
What caught their eye: ${caught.length ? caught.join(", ") : "they didn't say"}.${c.why ? ` In their words: "${c.why}".` : ""}
In at most two sentences (under 40 words), say what the photo and painting genuinely share that is visible in both — focusing on what caught their eye — and one detail to look for in the painting. Speak to them ("your photo"). No preamble.`;
  try {
    const text = await see(prompt, [c.photo, p.img]); if (!text) throw 0;
    c.notes = c.notes || {}; c.notes[key] = text; store.save();
    if (S.active === c && S.results?.painting === painting) $("noteEl").innerHTML = `<p>${esc(text)}</p>`;
  } catch (err) { console.warn(err); if (S.active === c) $("whySec")?.remove(); }
}
$("result").addEventListener("click", e => {
  const a = e.target.closest("[data-action]")?.dataset.action, g = e.target.closest("[data-goto]")?.dataset.goto;
  if (a === "edit") { $("result").hidden = true; openFlow("ask", S.active); }
  else if (a === "to-map") { $("result").hidden = true; focusOn(S.active, [S.results?.painting, S.results?.person]); }
  else if (g) { const n = S.captures.find(c => c.id === g); if (n) { $("result").hidden = true; openSheet(n); } }
});

// ---------- Map detail sheet ----------
function openSheet(n) {
  const s = $("sheet"); let h = `<button class="icon-btn close" data-action="close-sheet" aria-label="Close">${icon("x")}</button>`;
  if (n.kind === "painting") {
    const p = n.data;
    h += `<img class="hero" src="${esc(p.img)}" alt="${esc(p.title)}"><h3>${esc(p.title)}</h3><div class="meta">${esc(p.artist)} · ${esc(p.date)}</div>
      ${p.gallery ? `<span class="badge on"><span class="dot"></span>On view · Gallery ${esc(p.gallery)}</span>` : `<span class="badge">Not on view</span>`}
      <div><a class="met-link" style="margin-top:8px" href="${esc(p.url)}" target="_blank" rel="noopener">Read more at The Met ${icon("ext")}</a></div>`;
  } else if (n.kind === "generated") {
    h += `<img class="hero" src="${esc(n.photo)}" alt=""><span class="badge gen"><span class="dot"></span>Generated — not a real person</span>`;
  } else {
    const chips = pillSummary(n.pills);
    h += `<img class="hero" src="${esc(n.photo)}" alt=""><h3>${isMine(n) ? "You" : esc(n.name)}</h3>
      ${chips.length ? `<div class="chips" style="margin-top:8px">${chips.map(t => `<span class="chip sm" aria-pressed="true">${esc(t)}</span>`).join("")}</div>` : ""}
      ${n.why ? `<p class="quote">“${esc(n.why)}”</p>` : ""}
      ${isMine(n) ? `<button class="btn primary block" data-action="explore-capture" data-id="${n.id}">Let’s explore ${icon("arrow")}</button>` : ""}`;
  }
  s.innerHTML = h; s.hidden = false; focusOn(n, [], true);
}
function closeSheet() { $("sheet").hidden = true; }
$("sheet").addEventListener("click", e => {
  const a = e.target.closest("[data-action]"); if (!a) return;
  if (a.dataset.action === "close-sheet") closeSheet();
  if (a.dataset.action === "explore-capture") { const c = S.captures.find(c => c.id === a.dataset.id); closeSheet(); exploreExisting(c); }
});
function exploreExisting(c) { // straight to the result if they've answered before, otherwise ask first
  if (c.query) { flow.capture = c; flow.step = "explore"; showResult(c); } else openFlow("ask", c);
}

// ---------- Mine ----------
function renderMine() {
  const mine = S.captures.filter(isMine).sort((a, b) => b.createdAt - a.createdAt);
  $("mineCount").textContent = mine.length;
  $("mineList").innerHTML = mine.length ? mine.map(c => `
    <button class="mine-item" data-id="${c.id}"><img src="${esc(c.photo)}" alt="">
      <div><div class="w">${esc(c.why || pillSummary(c.pills).join(" · ") || "Not explored yet")}</div>
      <div class="d">${new Date(c.createdAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</div></div>
    </button>`).join("") : `<p class="empty-state">Nothing yet. Tap + to capture something that catches your eye.</p>`;
}
$("mineBtn").onclick = () => { closeSheet(); renderMine(); $("drawer").hidden = false; };
$("mineList").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (!b) return; $("drawer").hidden = true; exploreExisting(S.captures.find(c => c.id === b.dataset.id)); });

// ---------- Generate: labeled synthetic samples so the map isn't empty ----------
const GEN_SUBJECTS = ["steam rising from a teacup by a window", "laundry drying on a city balcony", "moss on an old stone wall", "neon reflected in a rain puddle",
  "a red umbrella in a grey crowd", "light through a lace curtain", "peeling paint on a blue door", "seagulls over a misty harbor", "wilting tulips on a kitchen table",
  "leaf shadows on a sidewalk", "fresh snow on a parked bicycle", "an empty subway car at night", "tall grass at dusk", "oranges piled at a market stall", "a lone tree in fog", "waves on dark rocks"];
const GEN_LIGHT = ["golden hour", "overcast morning", "harsh noon sun", "blue hour", "late-night streetlight", "soft window light"];
const pick = a => a[Math.floor(Math.random() * a.length)];
async function genOne() {
  const prompt = `A candid phone photo of ${pick(GEN_SUBJECTS)}, ${pick(GEN_LIGHT)}, unposted, natural colors`;
  const url = await generateImage(prompt), imgEmb = await embedImage(url); // only add once both succeed
  const c = { id: uid(), kind: "generated", owner: "generate", name: "Generated", photo: url, palette: [], prompt, imgEmb, why: "", pills: {}, query: "", whyEmb: null, notes: {}, createdAt: Date.now() };
  refresh(c); S.captures.push(c); return c;
}
$("genBtn").onclick = async () => {
  const b = $("genBtn"); b.disabled = true;
  const ok = (await Promise.allSettled([genOne(), genOne(), genOne()])).filter(r => r.status === "fulfilled").length;
  store.save(); b.disabled = false;
  toast(ok ? `Added ${ok} generated sample${ok > 1 ? "s" : ""}` : "Generation failed — try again");
};

// ---------- Global ----------
document.addEventListener("click", e => {
  const a = e.target.closest("[data-action]")?.dataset.action;
  if (a === "close-flow") closeFlow();
  if (a === "close-drawer") $("drawer").hidden = true;
});
$("flow").addEventListener("click", e => { if (e.target === $("flow")) closeFlow(); });
$("addBtn").onclick = () => openFlow("capture");
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("result").hidden) $("result").hidden = true; else if (!$("flow").hidden) closeFlow(); else { closeSheet(); $("drawer").hidden = true; }
});
addEventListener("resize", resize);

(function boot() {
  resize(); layoutPaintings();
  const saved = store.load();
  S.me = saved.me && saved.me.id ? saved.me : { id: "u_" + uid(), name: "" };
  for (const c of saved.captures || []) { refresh(c); S.captures.push(c); }
  store.save();
  requestAnimationFrame(frame);
})();
</script>
</body>
